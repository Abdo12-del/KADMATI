name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A push to a PR branch fires both this and the `push` event; cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The gate the project is developed against.
      - name: Typecheck
        run: npm run typecheck

      # Sanitizers + document model (jsdom).
      - name: Unit tests
        run: npm run test:unit

      # Animation engine (744 assertions) and the PDF → deck pipeline (54).
      # test:pdf generates its own fixtures, so no cached state is needed.
      - name: Animation tests
        run: npm run test:anim
      - name: PDF pipeline tests
        run: npm run test:pdf

      # Dataset + gateway stub smoke.
      - name: Model smoke
        run: npm run test:model

      # Fails the build on a broken bundle, not just on a type error.
      - name: Build
        run: npm run build
